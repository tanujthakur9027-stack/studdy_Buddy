services:
  - type: web
    name: studdy-buddy-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free

    envVars:
      # ── Primary LLM — OpenAI ─────────────────────────────────────────────────
      # Set this in the Render dashboard → Environment — do NOT commit your real key
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # ── Fallback LLM — Groq (FREE alternative) ───────────────────────────────
      # If OPENAI_API_KEY is absent, set GROQ_API_KEY to use Groq instead.
      # Get a free key at https://console.groq.com/keys
      # - key: GROQ_API_KEY
      #   sync: false
      # - key: GROQ_MODEL
      #   value: llama-3.3-70b-versatile

      # ── CORS ──────────────────────────────────────────────────────────────────
      # Production: set to your Vercel deployment URL
      # Local dev: handled by .env (CORS_ORIGINS=http://localhost:3000)
      - key: CORS_ORIGINS
        value: https://studdy-buddy-tau.vercel.app

      # ── Storage paths ────────────────────────────────────────────────────────
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: FAISS_INDEX_DIR
        value: ./faiss_indexes

      # ── Tuning ───────────────────────────────────────────────────────────────
      - key: MAX_FILE_SIZE_MB
        value: 20
      - key: CHUNK_SIZE
        value: 800
      - key: CHUNK_OVERLAP
        value: 100
