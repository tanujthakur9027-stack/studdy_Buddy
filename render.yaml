services:
  - type: web
    name: studdy-buddy-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free

    envVars:
      # ── OpenAI API ───────────────────────────────────────────────────────────
      # Fill this in the Render dashboard — do NOT put your real key here
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # ── CORS — set to your Vercel URL after deploying frontend ────────────────
      - key: CORS_ORIGINS
        value: https://studdy-buddy-tau.vercel.app

      # ── Storage paths ────────────────────────────────────────────────────────
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: FAISS_INDEX_DIR
        value: ./faiss_indexes

      # ── Tuning ───────────────────────────────────────────────────────────────
      - key: MAX_FILE_SIZE_MB
        value: 20
      - key: CHUNK_SIZE
        value: 800
      - key: CHUNK_OVERLAP
        value: 100
