services:
  - type: web
    name: studdy-buddy-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free

    envVars:
      # ── PRIMARY LLM — OpenAI ──────────────────────────────────────────────────
      # If you have an OpenAI key, set it here. It takes priority over Groq.
      # Get one at https://platform.openai.com/api-keys
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: OPENAI_MODEL
      #   value: gpt-4o-mini

      # ── FALLBACK LLM — Groq (FREE, no credit card required) ──────────────────
      # Used automatically when OPENAI_API_KEY is absent.
      # Get a FREE key at https://console.groq.com/keys  (sign up with GitHub)
      # Recommended model: llama-3.3-70b-versatile (fast, capable, free)
      - key: GROQ_API_KEY
        sync: false          # ← paste your gsk_... key in the Render dashboard
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b

      # ── CORS ──────────────────────────────────────────────────────────────────
      # Set to your Vercel URL AFTER the frontend is deployed (Step 4 in DEPLOY.md)
      # Multiple origins: comma-separated  e.g. https://a.vercel.app,https://b.vercel.app
      - key: CORS_ORIGINS
        value: "*"

      # ── Storage paths (inside the container) ─────────────────────────────────
      # /tmp is always writable on Render's ephemeral container filesystem.
      # (Render free tier has no persistent disk — uploads reset on redeploy,
      #  but the service stays alive between requests.)
      - key: CHROMA_PERSIST_DIR
        value: /tmp/chroma_db
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: FAISS_INDEX_DIR
        value: /tmp/faiss_indexes

      # ── Tuning ────────────────────────────────────────────────────────────────
      - key: MAX_FILE_SIZE_MB
        value: 200
      - key: CHUNK_SIZE
        value: 800
      - key: CHUNK_OVERLAP
        value: 100
